[package]
name = "paisho-selfplay-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
paisho-core = { path = "vendor/paisho-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "=1.11.0"

[workspace]
members = ["vendor/paisho-core"]

[workspace.package]
edition = "2021"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"
